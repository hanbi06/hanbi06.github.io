# -----------------------------------------------------------------------------
# 사이트 설정
# -----------------------------------------------------------------------------

title: Jo SeongMin # 웹사이트 제목 (비어 있으면 전체 이름이 대신 사용됩니다)
first_name: Jo
middle_name: ""
last_name: SeongMin
contact_note: >
  연락할 때 가장 좋은 방법에 대해 짧은 메모를 추가할 수 있습니다.
description: > # ">" 기호는 "footer_text:"까지 줄바꿈을 무시합니다
  A simple, whitespace theme for academics. Based on [*folio](https://github.com/bogoli/-folio) design.
footer_text: >
  Powered by <a href="https://hanbi.com/" target="_blank">hanbi</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
  Photos from <a href="https://unsplash.com" target="_blank">Unsplash</a>.
keywords: hanbi, hanbi-theme, academic-website, portfolio-website # 키워드를 추가하거나 비워 둘 수 있습니다
lang: ko # 사이트의 언어 (예: en, fr, cn, ru 등)
icon: ⚛️ # 파비콘으로 사용할 이모지 (또는 /assets/img/에 이미지 이름 제공)

url: https://hanbi06.github.io # 사이트의 기본 호스트 이름 및 프로토콜
baseurl: "" # 사이트의 서브 경로, 예: /blog/. 루트인 경우 빈 문자열로 둡니다
last_updated: true # footer에 마지막 업데이트를 표시하려면 true로 설정
impressum_path: # footer에 Impressum 링크를 포함하려면 경로를 설정하세요. 페이지의 permalink와 동일한 경로를 사용하며 EU GDPR 준수에 도움을 줍니다.
back_to_top: false # 상단으로 이동 버튼을 비활성화하려면 false로 설정

# -----------------------------------------------------------------------------
# 테마
# -----------------------------------------------------------------------------

# 저장소 색상 테마
repo_theme_light: default # https://github.com/anuraghazra/github-readme-stats/blob/master/themes/README.md
repo_theme_dark: dark # https://github.com/anuraghazra/github-readme-stats/blob/master/themes/README.md
repo_trophies:
  enabled: true
  theme_light: flat # https://github.com/ryo-ma/github-profile-trophy
  theme_dark: gitdimmed # https://github.com/ryo-ma/github-profile-trophy

# 리포지토리 페이지용 외부 서비스 URL
# GitHub 통계 및 트로피를 표시하기 위해 다른 인스턴스나 서비스를 사용하려면
# 이 URL을 업데이트하세요. 이 값들은 리포지토리 템플릿에서 사용됩니다.
external_services:
  github_readme_stats_url: https://github-readme-stats.vercel.app
  github_profile_trophy_url: https://github-profile-trophy.vercel.app

# -----------------------------------------------------------------------------
# al-folio API (v1.x)
# -----------------------------------------------------------------------------

al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: true
  features:
    cv:
      enabled: true
    distill:
      enabled: true
  compat:
    bootstrap:
      enabled: false
      support_window: v1.0-v1.2
      deprecates_in: v1.3
      removed_in: v2.0
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false

# -----------------------------------------------------------------------------
# RSS 피드
# -----------------------------------------------------------------------------
# title 및 url 필드를 사용합니다
# 더 많은 커스터마이징은 https://github.com/jekyll/jekyll-feed 를 참조하세요

# -----------------------------------------------------------------------------
# 레이아웃
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true
search_enabled: true
socials_in_search: true
posts_in_search: true
bib_search: true

# 크기
max_width: 930px

# -----------------------------------------------------------------------------
# Open Graph 및 Schema.org
# -----------------------------------------------------------------------------
# 소셜 미디어에 미리보기 객체가 있는 링크를 표시합니다.
# 자세한 내용은 https://schema.org/docs/faq.html 를 참조하세요
serve_og_meta: false # HTML head에 Open Graph 메타 태그를 포함합니다
serve_schema_org: false # HTML head에 Schema.org를 포함합니다
og_image: # 모든 링크의 기본값으로 사용할 사이트 전체 Open Graph 미리보기 이미지

# -----------------------------------------------------------------------------
# 분석 및 검색 엔진 확인
# -----------------------------------------------------------------------------

analytics:
  # Google Analytics에 대해서는 https://support.google.com/analytics/answer/10447272?hl=en&ref_topic=14088998&sjid=5129943941510317771-SA#zippy=%2Cgoogle-sites 를 참고하고
  # Google Sites 지침을 따르세요. Google Analytics 속성을 만들어 Google 태그 ID를 복사해야 합니다.
  google: # Google Analytics 측정 ID (형식: G-XXXXXXXXXX)
  cronitor: # cronitor RUM 분석 사이트 ID (형식: XXXXXXXXX)
  pirsch: # Pirsch 분석 사이트 ID (길이 32자)
  openpanel: # Openpanel 분석 클라이언트 ID (형식: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX)

# Google Search Console에 대해서는 https://support.google.com/webmasters/answer/9008080?hl=en#meta_tag_verification&zippy=%2Chtml-tag 를 참조하세요
google_site_verification: # Google Search Console용 google-site-verification ID
bing_site_verification: # Bing Webmaster용 bing-site-verification ID

# -----------------------------------------------------------------------------
# 블로그
# -----------------------------------------------------------------------------

blog_name: al-folio # blog_name은 블로그 페이지에 표시됩니다
blog_description: a simple whitespace theme for academics
permalink: /blog/:year/:title/
lsi: false # 관련 게시물 인덱스를 생성합니다

# 페이지 매김
pagination:
  enabled: true

related_blog_posts:
  enabled: true
  max_related: 5

# Giscus 댓글 (추천)
# https://giscus.app의 지침을 따라 리포지토리를 설정한 후 아래 정보를 채우세요.
giscus:
  repo: # <your-github-user-name>/<your-github-repo-name>
  repo_id: # 비워 두거나 repo_id를 지정하세요 (https://giscus.app 참조)
  category: Comments # 토론이 생성될 카테고리 이름
  category_id: # 비워 두거나 category_id를 지정하세요 (https://giscus.app 참조)
  mapping: title # 게시물 제목으로 토론을 식별합니다
  strict: 1 # 엄격 식별 모드를 사용합니다
  reactions_enabled: 1 # 이모지 반응을 활성화(1) 또는 비활성화(0)합니다
  input_position: bottom # 댓글 입력 양식을 아래(하단) 또는 위(상단)에 표시할지 여부
  dark_theme: dark # 다크 모드 색상 스킴 이름 (preferred는 al-folio 다크 모드와 잘 맞습니다)
  light_theme: light # 라이트 모드 색상 스킴 이름 (preferred는 al-folio 라이트 모드와 잘 맞습니다)
  emit_metadata: 0
  lang: en

# Disqus 댓글 (사용 중단)
disqus_shortname: al-folio # Disqus shortname을 입력하세요
# https://help.disqus.com/en/articles/1717111-what-s-a-shortname

# 외부 소스
# medium.com 또는 다른 외부 소스에 게시된 블로그 글이 있는 경우
# RSS 피드 링크를 추가하여 블로그에 표시할 수 있습니다.
# 선택 사항: 각 소스의 게시물에 대한 기본 카테고리와 태그를 설정하세요.
external_sources:
  - name: medium.com
    rss_url: https://medium.com/@al-folio/feed
    categories: [external-posts]
    tags: [medium]
  - name: Google Blog
    posts:
      - url: https://blog.google/technology/ai/google-gemini-update-flash-ai-assistant-io-2024/
        published_date: 2024-05-14
    categories: [external-posts]
    tags: [google]

# -----------------------------------------------------------------------------
# 뉴스레터
# -----------------------------------------------------------------------------

newsletter:
  enabled: false
  endpoint: # loops 엔드포인트 (예: https://app.loops.so/api/newsletter-form/YOUR-ENDPOINT)
  # https://loops.so/docs/forms/custom-form

# -----------------------------------------------------------------------------
# 컬렉션
# -----------------------------------------------------------------------------

collections:
  books:
    output: true
  news:
    defaults:
      layout: post
    output: true
  projects:
    output: true
  teachings:
    output: true

# -----------------------------------------------------------------------------
# Jekyll 설정
# -----------------------------------------------------------------------------

# Markdown and syntax highlight
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & excludes
include: ["_pages"]
exclude:
  - al-folio-upgrade-report.md
  - bin/
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - docs/
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - INSTALL.md
  - LICENSE
  - lighthouse_results/
  - package.json
  - package-lock.json
  - _pages/about_einstein.md
  - purgecss.config.js
  - README.md
  - readme_preview/
  - gems/
  - migrations/
  - vendor
keep_files:
  - CNAME
  - .nojekyll

# Use al_folio_core as the theme runtime; local files can still override theme files.
theme: al_folio_core

# Plug-ins
plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

  # al-folio plugins
  - al_folio_core
  - al_icons
  - al_folio_cv
  - al_folio_distill
  - al_folio_upgrade
  - al_folio_bootstrap_compat
  - al_cookie
  - al_analytics
  - al_citations
  - al_ext_posts
  - al_img_tools
  - al_search
  - al_charts
  - al_math
  - al_comments
  - al_newsletter

# Sitemap settings
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

# -----------------------------------------------------------------------------
# Jekyll Minifier
# -----------------------------------------------------------------------------

jekyll-minifier:
  compress_javascript: false # set to false since we are using terser as the js minifier
  # CSS is already minified upstream (Tailwind build ships tailwind.css; main.scss is compiled
  # with sass `style: compressed`). Re-minifying via cssminify2 mangles Tailwind v4 spacing
  # tokens inside calc(), turning `var(--spacing)` into the invalid `var( -  - spacing)` and
  # breaking every spacing/positioning utility (e.g. .fixed-top -> broken navbar). Disable it.
  compress_css: false
  # JS minification is delegated to jekyll-terser (compress_javascript above is false).
  exclude: ["robots.txt"]

# -----------------------------------------------------------------------------
# Terser
# -----------------------------------------------------------------------------

terser:
  compress:
    drop_console: true

# -----------------------------------------------------------------------------
# Jekyll Archives
# -----------------------------------------------------------------------------

jekyll-archives:
  posts:
    enabled: [year, tags, categories] # enables year, tag and category archives (remove if you need to disable one of them).
    permalinks:
      year: "/blog/:year/"
      tags: "/blog/:type/:name/"
      categories: "/blog/:type/:name/"
  books:
    enabled: [year, tags, categories] # enables year, tag and category archives (remove if you need to disable one of them).

display_tags: ["formatting", "images", "links", "math", "code", "blockquotes"] # these tags will be displayed on the front page of your blog
display_categories: ["external-services"] # these categories will be displayed on the front page of your blog

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  last_name: [Einstein]
  first_name: [Albert, A.]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  # Note: if you have latex math in your bibtex, the latex filter
  # preprocessing may conflict with MathJAX if the latter is enabled.
  # See https://github.com/alshedivat/al-folio/issues/357.
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending

# Display different badges withs stats for your publications
# Customize badge behavior in _layouts/bib.liquid
enable_publication_badges:
  altmetric: true # Altmetric badge (Customization options: https://badge-docs.altmetric.com/index.html)
  dimensions: true # Dimensions badge (Customization options: https://badge.dimensions.ai/)
  google_scholar: true # Google Scholar badge (https://scholar.google.com/intl/en/scholar/citations.html)
  inspirehep: true # Inspire HEP badge (https://help.inspirehep.net/knowledge-base/citation-metrics/)

# Filter out certain bibtex entry keywords used internally from the bib output
filtered_bibtex_keywords:
  [
    abbr,
    abstract,
    additional_info,
    altmetric,
    annotation,
    arxiv,
    award,
    award_name,
    bibtex_show,
    blog,
    code,
    dimensions,
    eprint,
    google_scholar_id,
    hal,
    html,
    inspirehep_id,
    pdf,
    pmid,
    poster,
    preview,
    selected,
    slides,
    supp,
    video,
    website,
  ]

# Maximum number of authors to be shown for each publication (more authors are visible on click)
max_author_limit: 3 # leave blank to always show all authors
more_authors_animation_delay: 10 # more authors are revealed on click using animation; smaller delay means faster animation

# Enables publication thumbnails. If disabled, none of the publications will display thumbnails, even if specified in the bib entry.
enable_publication_thumbnails: true

# -----------------------------------------------------------------------------
# Jekyll Link Attributes
# -----------------------------------------------------------------------------

# These are the defaults
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# -----------------------------------------------------------------------------
# Responsive WebP Images
# -----------------------------------------------------------------------------

# MAKE SURE imagemagick is installed and on your PATH before enabling imagemagick. In a terminal, run:
#   convert -version
imagemagick:
  enabled: true # enables responsive images for your site (recommended, see https://github.com/alshedivat/al-folio/issues/537)
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
    - ".gif"
  output_formats:
    webp: "-auto-orient -quality 85"

# Lazy loading images
#   If you enable lazy loading, all images will add the loading="lazy" attribute.
#   This will make your site load faster, but it may not be supported in all browsers.
#   You can also set loading="" to other values for specific images to override the default behavior.
#   Options: "auto", "eager", "lazy"
#   See https://web.dev/browser-level-image-lazy-loading/ for more information.
lazy_loading_images: true # enables lazy loading of images (recommended)

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_verification: false # enables google site verification
enable_bing_verification: false # enables bing site verification
enable_cookie_consent: false # enables GDPR-compliant cookie consent dialog (https://github.com/orestbida/cookieconsent)
enable_masonry: true # enables automatic project cards arrangement
enable_math: true # enables math typesetting (uses MathJax)
enable_tooltips: false # enables automatic tooltip links generated for each section titles on pages and posts
enable_darkmode: true # enables switching between light/dark modes
enable_navbar_social: false # enables displaying social links in the navbar on the about page
enable_project_categories: true # enables categorization of projects into multiple categories
enable_medium_zoom: true # enables image zoom feature (as on medium.com)
enable_progressbar: true # enables a horizontal progress bar linked to the vertical scroll position
enable_video_embedding: false # enables video embedding for bibtex entries. If false, the button opens the video link in a new window.

